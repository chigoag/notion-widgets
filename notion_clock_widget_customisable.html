<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clock Widget</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font, Georgia, 'Times New Roman', serif);
  }
  .widget {
    text-align: center;
    padding: 28px 48px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .label {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .time {
    font-size: 46px;
    color: var(--text);
    letter-spacing: 2px;
  }
  .date {
    font-size: 14px;
    color: var(--accent);
    margin-top: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="widget">
    <div class="label" id="label"></div>
    <div class="time" id="time">--:--</div>
    <div class="date" id="date">Loading…</div>
  </div>
  <script>
    // Read customisation from the URL, e.g.:
    // ?theme=beige&label=Good%20Morning&format=24&font=serif
    const params = new URLSearchParams(window.location.search);

    const themes = {
      beige:    { bg: '#F5F0E8', card: '#FBF7F1', border: '#D8C9B0', text: '#6B5B45', accent: '#A8927A' },
      blush:    { bg: '#F7ECEA', card: '#FDF6F5', border: '#E3C3BE', text: '#8A5A52', accent: '#C99A92' },
      sage:     { bg: '#EEF1E8', card: '#F6F8F2', border: '#C9D4B8', text: '#586B45', accent: '#95A87F' },
      charcoal: { bg: '#2B2B29', card: '#3A3A37', border: '#5C5A52', text: '#F0EAD8', accent: '#C9A66B' }
    };
    const fonts = {
      serif: "Georgia, 'Times New Roman', serif",
      sans:  "'Helvetica Neue', Arial, sans-serif"
    };

    const theme = themes[params.get('theme')] || themes.beige;
    const font = fonts[params.get('font')] || fonts.serif;
    const label = params.get('label') || '';
    const use24h = params.get('format') === '24';

    document.body.style.setProperty('--bg', theme.bg);
    document.body.style.setProperty('--card', theme.card);
    document.body.style.setProperty('--border', theme.border);
    document.body.style.setProperty('--text', theme.text);
    document.body.style.setProperty('--accent', theme.accent);
    document.body.style.setProperty('--font', font);
    document.body.style.background = theme.bg;
    document.getElementById('label').textContent = label;
    document.getElementById('label').style.display = label ? 'block' : 'none';

    function update() {
      const now = new Date();
      document.getElementById('time').textContent = now.toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', hour12: !use24h
      });
      document.getElementById('date').textContent = now.toLocaleDateString('en-GB', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
    }
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
